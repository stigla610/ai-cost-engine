[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenbench"
version = "2.1.0"
description = "Zero-dependency local GPU VRAM & LLM compatibility checker with Ollama and vLLM launch commands"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "TokenBench"}]
requires-python = ">=3.8"
keywords = ["llm", "vram", "gpu", "ollama", "vllm", "ai-pricing", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://stigla610.github.io/ai-cost-engine/"
Calculators = "https://stigla610.github.io/ai-cost-engine/vram-electricity-calculator.html"
Benchmarks = "https://stigla610.github.io/ai-cost-engine/benchmarks.html"
"Cloud GPU Pricing" = "https://stigla610.github.io/ai-cost-engine/gpu-cloud-pricing.html"
"Hugging Face Space" = "https://huggingface.co/spaces/stigla610/llm-vram-cost-calculator"
Repository = "https://github.com/stigla610/ai-cost-engine"
Issues = "https://github.com/stigla610/ai-cost-engine/issues"

[project.scripts]
tokenbench = "tokenbench:main"

[tool.setuptools]
py-modules = ["tokenbench"]
